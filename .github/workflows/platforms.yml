name: Platformcontrole
on:
  push:
    branches: [main, ch514-platforms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node --check web/app.js
      - run: npm test
        env:
          PYTHON: python
          TEST_CAPTURE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: test-results/
